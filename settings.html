<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>Vertex 代理 · 设置</title>
  <style>
    :root{
      --bg:#0b0f14; --panel:#141b23; --line:#26313d; --text:#e6edf3; --muted:#8b98a5;
      --dim:#5c6b7a; --ok:#3fb950; --warn:#d29922; --err:#f85149;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:radial-gradient(900px 420px at 50% -12%,#1a2634 0%,#0b0f14 60%),var(--bg);
      color:var(--text); min-height:100vh;
      font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .page{max-width:760px; margin:0 auto; padding:26px 22px 40px}
    header{display:flex; align-items:center; gap:12px; margin-bottom:4px}
    header img{width:44px;height:44px;display:block}
    h1{font-size:19px;margin:0;font-weight:600}
    .sub{color:var(--dim);font-size:12px;margin:0 0 18px}
    .card{
      background:linear-gradient(180deg,var(--panel) 0%,#111820 100%);
      border:1px solid var(--line); border-radius:12px; padding:18px 18px 6px; margin-bottom:14px;
    }
    .field{margin-bottom:16px}
    .field > label{display:block;font-size:12px;color:var(--muted);letter-spacing:.5px;margin-bottom:6px}
    input[type=text],input[type=number],select{
      width:100%; background:#0f151c; border:1px solid #26313d; color:var(--text);
      border-radius:8px; padding:8px 10px; font-size:13px; outline:none; transition:.15s;
      font-family:inherit;
    }
    input:focus,select:focus{border-color:#3d7cc9;box-shadow:0 0 0 3px rgba(56,139,253,.12)}
    input:disabled{opacity:.45;cursor:not-allowed}
    input[readonly]{color:#a9b6c4}
    .row{display:flex; gap:8px; align-items:center}
    .row > .grow{flex:1; min-width:0}
    .btn{
      appearance:none; border:1px solid var(--line); background:#1a232e; color:var(--text);
      padding:8px 14px; border-radius:8px; font-size:13px; cursor:pointer; transition:.15s; white-space:nowrap;
    }
    .btn:hover:not(:disabled){border-color:#3d4c5c;background:#22303f}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .btn.primary{background:#12331f;border-color:#2b6b3c;color:#7ee787}
    .btn.primary:hover:not(:disabled){background:#17422a}
    .btn.ghost{background:transparent;color:var(--muted)}
    .hintline{font-size:11.5px;color:var(--dim);margin-top:5px;word-break:break-all}
    .hintline.ok{color:#7ee787}
    .hintline.err{color:#ffa198}
    .check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer;user-select:none}
    .check input{width:15px;height:15px;accent-color:#3fb950}
    .grid2{display:grid;grid-template-columns:1fr 140px;gap:10px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 18px}
    .msg{min-height:20px;font-size:12.5px;color:var(--muted);margin-top:4px}
    .msg.ok{color:#7ee787}
    .msg.err{color:#ffa198}
    .note{font-size:11.5px;color:var(--dim);line-height:1.8;border-top:1px dashed #22303c;padding-top:12px;margin-top:2px}
    .note b{color:var(--muted);font-weight:500}
  </style>
</head>
<body>
  <div class="page">
    <header>
      <img src="assets/icon.png" alt="" />
      <div>
        <h1>设置</h1>
        <p class="sub">配置只保存在本机，不会上传，也不会随安装包分发</p>
      </div>
    </header>

    <div class="card">
      <div class="field">
        <label>Google 服务账户 JSON</label>
        <div class="row">
          <input id="saPath" class="grow" type="text" readonly placeholder="尚未选择…" />
          <button id="pick" class="btn">选择文件…</button>
        </div>
        <div class="hintline" id="saInfo">需要一个带 Vertex AI 权限的服务账户密钥</div>
      </div>

      <div class="field">
        <label>监听端口</label>
        <input id="port" type="number" min="1024" max="65535" value="8318" />
        <div class="hintline">酒馆里的 Base URL 填 <code>http://127.0.0.1:端口/v1</code></div>
      </div>

      <div class="field">
        <label class="check"><input id="useProxy" type="checkbox" checked /> 通过上游代理访问 Vertex（国内网络通常需要）</label>
      </div>

      <div class="grid2" id="proxyRow">
        <div class="field" style="margin-bottom:16px">
          <label>上游代理地址</label>
          <input id="proxyHost" type="text" value="127.0.0.1" />
        </div>
        <div class="field" style="margin-bottom:16px">
          <label>代理端口</label>
          <input id="proxyPort" type="number" min="1" max="65535" value="7897" />
        </div>
      </div>

      <div class="field">
        <label>区域</label>
        <select id="location">
          <option value="global">global</option>
          <option value="us-central1">us-central1</option>
          <option value="us-east4">us-east4</option>
          <option value="asia-northeast1">asia-northeast1</option>
          <option value="asia-southeast1">asia-southeast1</option>
          <option value="europe-west4">europe-west4</option>
        </select>
        <div class="hintline">与 SA 项目可用的区域一致；一般保持 global</div>
      </div>
    </div>

    <div class="actions">
      <button id="save" class="btn primary">保存并启动</button>
      <button id="test" class="btn">测试上游</button>
      <button id="back" class="btn ghost">返回</button>
    </div>
    <div class="msg" id="msg"></div>

    <div class="note">
      <b>SA 文件</b>是 Google Cloud 的服务账户密钥，只在代理启动时读取，用来换取 OAuth token。<br />
      分发给别人时，每个人用自己的 SA；程序不会内置任何凭据。
    </div>
  </div>

  <script>
    (function () {
      'use strict';
      var $ = function (id) { return document.getElementById(id); };
      var loaded = { saPath: '', valid: false };

      function setMsg(text, kind) {
        $('msg').textContent = text || '';
        $('msg').className = 'msg' + (kind ? ' ' + kind : '');
      }

      function renderSa(info) {
        loaded.saPath = info.path || '';
        loaded.valid = !!info.valid;
        $('saPath').value = info.path || '';
        var line = $('saInfo');
        if (!info.path) {
          line.className = 'hintline';
          line.textContent = '需要一个带 Vertex AI 权限的服务账户密钥';
        } else if (info.valid) {
          line.className = 'hintline ok';
          line.textContent = '有效 · 项目 ' + (info.projectId || '?') + (info.clientEmail ? ' · ' + info.clientEmail : '');
        } else {
          line.className = 'hintline err';
          line.textContent = '无效：' + (info.error || '文件内容不符合服务账户格式');
        }
      }

      function syncProxyEnabled() {
        var on = $('useProxy').checked;
        $('proxyHost').disabled = !on;
        $('proxyPort').disabled = !on;
        $('proxyRow').style.opacity = on ? '1' : '.55';
      }

      window.vx.settingsGet().then(function (data) {
        var c = (data && data.config) || {};
        var d = (data && data.defaults) || {};
        $('port').value = c.port || d.port || 8318;
        $('location').value = c.location || d.location || 'global';
        $('proxyHost').value = c.proxyHost || d.proxyHost || '127.0.0.1';
        $('proxyPort').value = c.proxyPort || d.proxyPort || 7897;
        $('useProxy').checked = c.useProxy !== false;
        renderSa((data && data.sa) || { path: c.saPath || '', valid: false });
        syncProxyEnabled();
      });

      $('useProxy').onchange = syncProxyEnabled;

      $('pick').onclick = function () {
        $('pick').disabled = true;
        window.vx.chooseSa().then(function (r) {
          $('pick').disabled = false;
          if (!r || r.canceled) return;
          if (!r.ok) { setMsg(r.error || '选择失败', 'err'); return; }
          renderSa(r);
          setMsg(r.valid ? '已选择，记得点「保存并启动」' : '这个文件不能用作服务账户', r.valid ? 'ok' : 'err');
        });
      };

      $('test').onclick = function () {
        if (!$('useProxy').checked) { setMsg('当前未启用上游代理，无需测试', ''); return; }
        $('test').disabled = true;
        setMsg('正在连接 ' + $('proxyHost').value + ':' + $('proxyPort').value + ' …', '');
        window.vx.testUpstream($('proxyHost').value, $('proxyPort').value).then(function (r) {
          $('test').disabled = false;
          if (r && r.ok) setMsg('上游 ' + r.target + ' 可连接', 'ok');
          else setMsg('连不上 ' + (r && r.target ? r.target : '') + (r && r.error ? '（' + r.error + '）' : ''), 'err');
        });
      };

      $('save').onclick = function () {
        var cfg = {
          saPath: loaded.saPath || $('saPath').value,
          port: Number($('port').value),
          location: $('location').value,
          proxyHost: $('proxyHost').value.trim(),
          proxyPort: Number($('proxyPort').value),
          useProxy: $('useProxy').checked,
        };
        if (!cfg.saPath) { setMsg('请先选择服务账户 JSON', 'err'); return; }
        if (!loaded.valid) { setMsg('SA 文件无效，请重新选择', 'err'); return; }

        $('save').disabled = true;
        window.vx.settingsSave(cfg).then(function (r) {
          $('save').disabled = false;
          if (!r || !r.ok) { setMsg('保存失败：' + (r && r.error ? r.error : '未知错误'), 'err'); return; }
          setMsg('已保存' + (r.projectId ? '（项目 ' + r.projectId + '）' : '') + '，正在启动代理…', 'ok');
          window.vx.retry();
          setTimeout(function () { window.location.href = 'index.html'; }, 700);
        });
      };

      $('back').onclick = function () { window.vx.back(); };
    })();
  </script>
</body>
</html>
